services:
  api:
    container_name: api
    build: ./api
    environment:
      - DATABASE_URL=sqlite:////api/data/db.sqlite3
    volumes:
      - ./db:/api/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    container_name: frontend
    build: ./frontend
    expose:
      - "80"
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    container_name: nginx
    image: nginx:1.28
    ports:
      - "80:80" # Или "8080:80", как у вас в override
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend # Nginx должен стартовать после фронтенда
    restart: unless-stopped
