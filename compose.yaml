services:
  api:
    build: ./api
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////api/data/db.sqlite3}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
    volumes:
      - ./db:/api/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    image: light-spa-frontend:prod
    build: ./frontend
    expose:
      - "80"
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    image: nginx:1.28
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend # Nginx должен стартовать после фронтенда
    restart: unless-stopped
