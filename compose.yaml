services:
  api:
    build: ./api
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////api/data/db.sqlite3}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - ADMIN_LOGIN=${ADMIN_LOGIN-admin1}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD-12345678}
      - REGISTRATION_ENABLED=${REGISTRATION_ENABLED:-true}
    volumes:
      - ./db:/api/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    image: light-spa-frontend:prod
    build: ./frontend
    expose:
      - "80"
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    image: nginx:1.28
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped
