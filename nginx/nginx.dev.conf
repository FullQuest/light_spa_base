events {}

http {
    upstream api { server api:8000; }
    upstream frontend { server frontend:5173; }

    server {
        listen 80;
        client_max_body_size 25m;

        location /api/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
        }

        location /docs {
            proxy_pass http://api;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://api;
            proxy_set_header Host $host;
        }

        location /redoc {
            proxy_pass http://api;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://frontend;
            # WebSocket нужен Vite для обновления страницы при изменении кода.
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
