services:
  api:
    volumes:
      - ./api:/api
      - ./db:/api/data
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - WATCHFILES_FORCE_POLLING=true

  frontend:
    build:
      context: ./frontend
      target: build # Используем только этап сборки, чтобы запустить dev-сервер
    volumes:
      - ./frontend:/app
      - /app/node_modules # Анонимный volume, чтобы не перезаписывать node_modules
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173" # Пробрасываем порт dev-сервера Vite
    environment:
      - NODE_ENV=development

  nginx:
    ports:
      - "8080:80"
