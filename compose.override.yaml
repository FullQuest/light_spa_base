services:
  api:
    volumes:
      - ./api:/api
      - ./algorithm:/api/algorithm:ro
      - ./db:/api/data
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - WATCHFILES_FORCE_POLLING=true

  frontend:
    image: light-spa-frontend:dev
    build:
      context: ./frontend
      target: build # Этап с Node.js; финальный образ содержит только Nginx.
    volumes:
      - ./frontend:/app
      - /app/node_modules # Зависимости контейнера не подменяются файлами с компьютера.
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - NODE_ENV=development

  nginx:
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
